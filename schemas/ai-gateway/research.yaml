openapi: "3.1.0"
info:
  title: AI Gateway — Research Evidence Job Request / Status
  version: "0.1.0"
  description: >
    Async evidence-gathering (URL-retrieval) job envelope routed through
    ai-gateway. Distinct from job.yaml's AiJobRequest/AiJobStatus (media
    generation, D047) and from request.yaml's AiRequest/AiResponse (synchronous
    text/vision calls) -- this pair exists because retrieval evidence has a
    shape neither of those covers: a caller needs to know, per source URL,
    whether the gateway actually fetched it (and what came back), kept
    structurally apart from anything a model narrates about that evidence.
    Submission is a synchronous HTTP call that returns as soon as the job is
    accepted onto the queue; execution (fetching each source, respecting its
    bound) is asynchronous -- poll GET /ai/research-jobs/{id} for the terminal
    result.

paths:
  /ai/research-jobs:
    post:
      summary: Submit a research evidence job through the gateway
      operationId: submitResearchJob
      description: >
        Accepts a list of source URLs to retrieve, each with its own retrieval
        bounds. Returns as soon as the job is accepted onto the queue -- it
        does not wait for any source to be fetched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchJobRequest"
      responses:
        "202":
          description: Job accepted onto the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJobStatus"
        "402":
          description: Cost/resource ceiling reached -- request blocked by Treasury (D023)
        "503":
          description: Retrieval backend unavailable
  /ai/research-jobs/{id}:
    get:
      summary: Get the current status of a submitted research evidence job
      operationId: getResearchJobStatus
      description: >
        Reconciliation route: an interrupted caller re-polls this by the same
        jobId it generated at submission time rather than guessing whether the
        (paid) retrieval work already ran.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJobStatus"
        "404":
          description: No research job with this id

components:
  schemas:
    ResearchJobRequest:
      type: object
      description: >
        Submitted by a caller (via ai-gateway) to request an async
        evidence-gathering job. jobId is caller-generated -- same idiom as
        ai.job.request's jobId -- so the caller can start polling/correlating
        before the 202 response returns, and can safely retry submission
        against the same jobId if the initial call is interrupted.
      required:
        - jobId
        - appId
        - sources
      properties:
        jobId:
          type: string
          format: uuid
          description: >
            Unique identifier for this job, generated by the caller. Used to
            poll GET /ai/research-jobs/{id}.
        appId:
          type: string
          description: >
            Functional app/caller identifier (D002) -- same shape as
            ai.job.request's appId.
          pattern: "^[a-z][a-z0-9-]+$"
          examples:
            - "plantpal"
            - "design-studio"
        sources:
          type: array
          minItems: 1
          description: >
            The URLs to retrieve, each with its own retrieval bounds. The
            gateway fetches each independently -- one source failing does not
            fail the others.
          items:
            $ref: "#/components/schemas/SourceRequest"
      additionalProperties: false

    SourceRequest:
      type: object
      description: A single URL to retrieve, with the bounds the gateway must enforce on it.
      required:
        - url
        - maxDurationMs
        - maxBytesPerSource
      properties:
        url:
          type: string
          format: uri
          description: The source URL to retrieve.
        maxDurationMs:
          type: integer
          minimum: 1
          description: >
            Maximum wall-clock time, in milliseconds, the gateway may spend
            retrieving this source before treating it as unavailable.
        maxBytesPerSource:
          type: integer
          minimum: 1
          description: >
            Maximum number of bytes the gateway may read from this source
            before truncating/abandoning the fetch and treating it as
            unavailable.
      additionalProperties: false

    ResearchJobStatus:
      type: object
      description: >
        Current state of a submitted research evidence job. Returned both by
        the submit call's 202 response (initial state, normally "queued") and
        by GET /ai/research-jobs/{id} (subsequent polls).
      required:
        - jobId
        - status
        - submittedAt
      properties:
        jobId:
          type: string
          format: uuid
          description: Echoes the jobId from the originating ResearchJobRequest.
        status:
          type: string
          enum: ["queued", "running", "succeeded", "failed", "cancelled"]
          description: Current lifecycle status of the job.
        evidence:
          type: array
          description: >
            Per-source retrieval evidence, one entry per requested source,
            populated as sources are fetched (may be partial while status is
            "running"). This array carries only what the gateway actually
            retrieved -- structurally separate from any model-generated
            narrative text, which this schema has no field for, so a citation
            a model invents can never be serialized into this array.
          items:
            $ref: "#/components/schemas/EvidenceItem"
        error:
          $ref: "#/components/schemas/ResearchJobError"
        submittedAt:
          type: string
          format: date-time
          description: When the job was accepted onto the queue.
        startedAt:
          type: string
          format: date-time
          description: When the job left the queue and began retrieving sources.
        finishedAt:
          type: string
          format: date-time
          description: When the job reached a terminal status (succeeded/failed/cancelled).
      additionalProperties: false
      if:
        properties:
          status:
            const: failed
      then:
        required:
          - error

    EvidenceItem:
      type: object
      description: >
        The retrieval outcome for a single requested source. Present once the
        gateway has attempted that source, regardless of whether the fetch
        succeeded.
      required:
        - url
        - status
      properties:
        url:
          type: string
          format: uri
          description: Echoes the url from the matching SourceRequest.
        status:
          type: string
          enum: ["retrieved", "unavailable", "rejected"]
          description: >
            "retrieved" -- fetched within bounds, fetchedAt/excerpt present.
            "unavailable" -- the gateway could not fetch it (timeout, network
            error, exceeded maxDurationMs/maxBytesPerSource). "rejected" --
            the gateway declined to fetch it (e.g. disallowed by robots.txt,
            blocked scheme/host, non-retrievable content-type).
        fetchedAt:
          type: string
          format: date-time
          description: When this source was fetched. Present only when status is "retrieved".
        excerpt:
          type: string
          description: >
            Raw excerpt of the retrieved content -- verbatim from the source,
            never model-generated. Present only when status is "retrieved".
        enforcedMaxDurationMs:
          type: integer
          minimum: 1
          description: >
            The maxDurationMs bound actually enforced for this source, echoed
            from the matching SourceRequest so the caller can see what was
            enforced rather than assuming its request was honored verbatim.
        enforcedMaxBytes:
          type: integer
          minimum: 1
          description: >
            The maxBytesPerSource bound actually enforced for this source,
            echoed from the matching SourceRequest.
        reason:
          type: string
          description: >
            Human-readable detail for why status is "unavailable" or
            "rejected". Absent when status is "retrieved".
      additionalProperties: false

    ResearchJobError:
      type: object
      description: Present when status is "failed"; absent otherwise.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable failure code (e.g. "backend-unavailable", "queue-timeout").
        message:
          type: string
          description: Human-readable failure detail.
      additionalProperties: false
